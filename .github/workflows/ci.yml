name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch: # manual runs from the Actions tab or `gh workflow run ci`

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - run: test -z "$(gofmt -l .)"
