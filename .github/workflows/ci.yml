name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch: # manual runs from the Actions tab or `gh workflow run ci`

jobs:
  build:
    # Pinned to the newest image so a future ubuntu-latest switch can't turn an
    # unrelated change red. Bump this deliberately.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - run: test -z "$(gofmt -l .)"
